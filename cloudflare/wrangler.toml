name = "exam-backend"
main = "worker.py"
compatibility_date = "2024-01-01"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "exam-quiz-db"
database_id = "你的数据库ID"  # 运行 wrangler d1 create exam-quiz-db 后获取

# KV 存储（可选，用于缓存）
# [[kv_namespaces]]
# binding = "CACHE"
# id = "你的KV命名空间ID"

# 环境变量（敏感信息请使用 wrangler secret put）
[vars]
ENVIRONMENT = "production"

# 需要通过 wrangler secret put 设置的密钥：
# wrangler secret put MINIMAX_API_KEY
# wrangler secret put KIMI_API_KEY
# wrangler secret put JWT_SECRET

# 路由配置
[[routes]]
pattern = "api/*"
zone_name = "your-domain.com"  # 替换为你的域名

# 开发配置
[dev]
port = 5000
local_protocol = "http"
